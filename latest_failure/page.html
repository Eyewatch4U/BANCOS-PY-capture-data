      <script>
        const submitPasscode = () => {
          const { pathname } = window.location;
          const input = document.getElementById("passcode");
          const btn = document.getElementById("submit");

          input.setAttribute("has-error", false);

          const passcode = input.value;
          if (passcode.length === 0) {
            input.setAttribute("has-error", true);
            input.setAttribute(
              "helper-text",
              "You must enter a password to move forward"
            );
            return;
          }

          btn.setAttribute("loading", true);
          input.setAttribute("disabled", true);

          const cookieAttr = {
            expires: 1,
            path: pathname,
            sameSite: "Lax",
            secure: true
          };

          Cookies.set("report_passcode", input.value.trim(), cookieAttr);
          window.location.reload(true);
        };
        window.addEventListener("load", event => {
          const btn = document.getElementById("submit");
          const input = document.getElementById("passcode");
          input.addEventListener("keyup", event => {
            if (event.keyCode === 13) {
              event.preventDefault();
              if (input.value && input.value.length > 0) submitPasscode();
            }
          });
        });
      </script>
